[alembic]
script_location = migrations
prepend_sys_path = src
# URL is injected from PODIUM_DATABASE_URL by migrations/env.py; this is a harmless placeholder.
sqlalchemy.url = postgresql+asyncpg://podium:podium@localhost:5432/podium

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
