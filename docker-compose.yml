# M0 dev stack: just Postgres. The api/conductor services join in later milestones.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: podium
      POSTGRES_PASSWORD: podium
      POSTGRES_DB: podium
    ports:
      - "5432:5432"
    volumes:
      - podium_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U podium -d podium"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  podium_pg:
